[package]
name = "edtr"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "edtr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` puts the WebView inspector in RELEASE builds too. Debug builds
# already have it — tauri gates the inspector on
# `any(debug_assertions, feature = "devtools")` — so this feature changes only
# the bundled `.app`, which is the artifact every GUI matrix is actually walked
# against. Without it, "zero console errors" was uncheckable on the thing we
# ship (6c-ii matrix item 17 went unverified for exactly this reason) and a
# defect seen in the release build could not be inspected where it appeared.
# Trade-off, accepted for Edtr: the shipped app is inspectable by whoever has
# it. Distribution is manual to a handful of people (6b), the app has no
# secrets and no network surface, and the whole bundle is user-readable
# JS on disk regardless.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# macOS-only, and only to arrange the Web Inspector's presentation — see
# src/devtools.rs. Kept target-scoped so no other platform pays for it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSDictionary", "NSString", "NSValue"] }

